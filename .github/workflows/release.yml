name: Release

# Tag a version to publish a release with the DMG attached:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build app and DMG
        run: make build

      - name: Verify universal binary
        run: lipo -info "build/Porter.app/Contents/MacOS/Porter"

      - name: Test (native engines — runners have no MS Office)
        run: make test-native

      - name: Rename DMG with version
        run: cp build/Porter.dmg "build/Porter-${GITHUB_REF_NAME}.dmg"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Porter-*.dmg
          generate_release_notes: true
